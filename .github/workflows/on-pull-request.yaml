name: On Pull Request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  lint:
    uses: ./.github/workflows/_lint.yaml
    secrets:
      npm_token: ${{ secrets.NPM_TOKEN }}

  build-and-test:
    needs: lint
    uses: ./.github/workflows/_build-and-test.yaml
    secrets:
      npm_token: ${{ secrets.NPM_TOKEN }}

  isolation:
    needs: lint
    uses: ./.github/workflows/_isolation.yaml
    secrets:
      npm_token: ${{ secrets.NPM_TOKEN }}

  pre-release:
    needs: [ build-and-test, isolation ]
    uses: ./.github/workflows/_pre-release.yaml
    secrets:
      npm_token: ${{ secrets.NPM_TOKEN }}
