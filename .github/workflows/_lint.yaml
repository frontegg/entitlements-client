name: Lint

on:
  workflow_call:
    secrets:
      npm_token:
        required: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 18
          cache: 'yarn'
      - name: generate NPMRC file
        run:
          echo "//registry.npmjs.org/:_authToken=${{ secrets.npm_token }}" > .npmrc
      - name: Install Dependencies
        run: yarn

      - name: Run Eslint
        run: yarn lint
      - name: Run Prettier
        run: yarn prettier
